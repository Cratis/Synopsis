name: Publish

# Never cancel a release in flight. On push every merge to main shares one group, so cancelling would let the
# next merge kill a run that may already have tagged and cut the release but not yet finished publishing.
# This also retires the hazard the pull_request trigger had, where a consolidation merge closed several pull
# requests at once and their simultaneous runs cancelled each other: one push is one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        default: 0.0.0
        type: string
      release-notes:
        description: Release notes
        required: true
        default: No release notes
        type: string
  push:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  NUGET_OUTPUT: ./Artifacts/NuGet

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}
  publish:
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build Synopsis.slnx --configuration Release -p:Version=${{ needs.release.outputs.version }}
      - name: Create NuGet packages
        run: dotnet pack Synopsis.slnx --no-build --configuration Release --output ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}
      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.release.outputs.tag }}' '${{ env.NUGET_OUTPUT }}'/*.nupkg '${{ env.NUGET_OUTPUT }}'/*.snupkg --clobber
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push NuGet packages
        if: steps.login.outcome == 'success'
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      - name: Report unavailable NuGet publishing
        if: steps.login.outcome != 'success'
        run: echo '::notice title=NuGet publishing skipped::The packages are attached to the GitHub release. Add the Cratis/Synopsis + publish.yml trusted-publishing policy on NuGet.org to enable registry publishing.'

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
    # and failing on those would make this job noise that everyone learns to ignore.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
