name: .NET Build

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET10_VERSION: "10.0.x"
  DOTNET11_VERSION: "11.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            ${{ env.DOTNET10_VERSION }}
            ${{ env.DOTNET11_VERSION }}
          dotnet-quality: preview
      - name: Build Debug
        run: dotnet build --configuration Debug -p:SpecificationsTestFrameworks='"net10.0;net11.0"'
      - name: Run specifications
        run: |
          for framework in net10.0 net11.0; do
            dotnet run --project Source/Specs/Specs.csproj --configuration Debug --no-build --framework "$framework"
          done
      - name: Build Release
        run: dotnet build --configuration Release -p:SpecificationsTestFrameworks='"net10.0;net11.0"'
      - name: Dogfood the repository
        run: dotnet run --project Source/Tool --framework net11.0 -- . --output Artifacts/synopsis.html --format both
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 3
          name: synopsis
          path: |
            Artifacts/synopsis.html
            Artifacts/synopsis.json
